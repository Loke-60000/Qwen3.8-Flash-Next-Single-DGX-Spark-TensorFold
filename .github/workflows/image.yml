# Builds the image scripts/prepare.sh would build (scripts/build-image.sh) and publishes it with scripts/publish-image.sh
# as ghcr.io/loke-60000/qwen3.8-flash-next-single-dgx-spark-tensorfold:<TensorFold version>-<patches hash> and :latest.
# It only runs when started by hand, from the Actions tab or with `gh workflow run image.yml`, never on a push or a pull request.
name: image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make room
        run: |
          echo "cores $(nproc), memory $(free -g | awk '/^Mem:/ {print $2}') GiB"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift
          docker system prune -af >/dev/null
          # the base image alone is 24 GB unpacked: Docker moves to /mnt when that disk has more room than /
          if mountpoint -q /mnt && (( $(df --output=avail /mnt | tail -1) > $(df --output=avail / | tail -1) )); then
            f=/etc/docker/daemon.json
            [ -s "$f" ] || echo '{}' | sudo tee "$f" >/dev/null
            sudo jq '."data-root" = "/mnt/docker"' "$f" | sudo tee "$f.new" >/dev/null && sudo mv "$f.new" "$f"
            sudo systemctl restart docker
          fi
          echo "Docker's root: $(docker info -f '{{.DockerRootDir}}')"
          df -h

      - name: Build
        run: scripts/build-image.sh

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          scripts/publish-image.sh
          source scripts/config.sh
          ref="$GHCR_IMAGE:${TF_TAG}-$(image_hash)"
          digest=$(docker image inspect -f '{{join .RepoDigests " "}}' "$ref")
          { echo "Published \`$ref\` and \`:latest\`"; echo; echo "\`$digest\`"; } >> "$GITHUB_STEP_SUMMARY"
